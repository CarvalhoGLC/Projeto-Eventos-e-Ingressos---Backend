[project]
name = "backend-events-tickets"
version = "0.1.0"
description = ""
authors = [
    {name = "Carvalho",email = "guilhermeclcosta@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
requires-bcrypt = "4.0.1"
requires-passlib = "1.7.4"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "typos (>=1.49.0,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=backend_events_tickets', '--cov-context=test']
